<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Horizon</title>
  <link rel="stylesheet" href="tab.css" />
  <script src="prepaint.js"></script>
</head>
<body>
  <div class="bg-layer" id="bgLayer"></div>
  <div class="ambient" id="ambient">
    <span class="orb orb-a"></span>
    <span class="orb orb-b"></span>
    <span class="orb orb-c"></span>
  </div>

  <div class="container" id="container">
    <section class="hero">
      <p class="greeting" id="greeting">good morning</p>
      <h1 class="time" id="time">--:--</h1>
      <p class="date" id="date">-----</p>
    </section>

    <section class="weather" id="weather">
      <span class="weather-icon" id="weatherIcon"></span>
      <span class="weather-temp" id="weatherTemp">--°</span>
      <span class="weather-div" aria-hidden="true"></span>
      <span class="weather-side">
        <span class="weather-desc" id="weatherDesc">loading...</span>
        <span class="weather-hilo" id="weatherHiLo">H --° L --°</span>
      </span>
    </section>

    <section class="search-section" id="searchSection">
      <form id="searchForm">
        <div class="search-row">
          <span class="mode-tag" id="modeTag">⬡ Google</span>
          <input type="text" id="searchInput" placeholder="Search..." spellcheck="false" autocomplete="off" />
          <span class="search-arrow" id="searchArrow">▼</span>
        </div>
      </form>
      <div class="search-body" id="searchBody">
        <div class="search-drawer" id="searchDrawer">
          <div class="drawer-section">
            <div class="drawer-tabbar" id="drawerTabbar">
              <button class="drawer-tab active" data-mode="web">Web Search</button>
              <button class="drawer-tab" data-mode="ai">AI Chat</button>
            </div>
            <div class="drawer-grid" id="drawerGrid"></div>
          </div>
          <div class="drawer-footer" id="drawerFooter">
            <div class="filter-bar" id="filterBar"></div>
            <p class="ai-hint" id="aiModeHint"></p>
          </div>
        </div>
      </div>
    </section>

    <section class="links" id="links"></section>
  </div>

  <button class="settings-toggle" id="settingsToggle" title="Customize" aria-label="Settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
  </button>

  <div class="settings-backdrop" id="settingsBackdrop"></div>
  <div class="settings-panel" id="settingsPanel">
    <div class="settings-header">
      <h2 id="settingsTitle">Horizon</h2>
      <button class="settings-close" id="settingsClose">✕</button>
    </div>
    <div class="settings-body" id="settingsBody"></div>
  </div>

  <input type="file" id="bgUpload" accept="image/*" hidden />

  <script src="tab.js"></script>
</body>
</html>
